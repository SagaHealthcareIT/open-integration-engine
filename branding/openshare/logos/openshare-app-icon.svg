<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenShare">
  <!-- App-icon source: reversed mesh on an emerald gradient tile (full-bleed /
       maskable). Apple/Android round the corners themselves; this is the source
       for apple-touch-icon.png + icon-192/512.png. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A5A40"/>
      <stop offset="1" stop-color="#053A2B"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#tile)"/>
  <g fill="none" stroke-width="6" stroke-linecap="round" transform="translate(14 14) scale(0.708)">
    <g stroke="#34D399"><line x1="24" y1="24" x2="72" y2="72"/><line x1="72" y1="24" x2="24" y2="72"/></g>
    <g stroke="#7FE0B6"><line x1="24" y1="24" x2="72" y2="24"/><line x1="72" y1="24" x2="72" y2="72"/><line x1="72" y1="72" x2="24" y2="72"/><line x1="24" y1="72" x2="24" y2="24"/></g>
  </g>
  <g transform="translate(14 14) scale(0.708)">
    <circle cx="24" cy="24" r="9" fill="#EAFFF6"/><circle cx="72" cy="72" r="9" fill="#EAFFF6"/>
    <circle cx="72" cy="24" r="9" fill="#7FE0B6"/><circle cx="24" cy="72" r="9" fill="#7FE0B6"/>
  </g>
</svg>
